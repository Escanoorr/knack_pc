# knack: the two DLLs that DLSS needs next to gow3-probe.exe (docs/knack-dlss.md):
#   gow3_dlss.dll   the bridge to NVIDIA's SDK (gpu/dlss_bridge), built here with MSVC;
#   nvngx_dlss.dll  NVIDIA's DLSS runtime, from the SDK checkout below.
# Separate from "Windows zip" on purpose: that package never carries NVIDIA's DLL (package.sh refuses
# it), and a workflow of its own cannot conflict with that one when the project is updated.
# Run by hand (Actions > Knack DLSS runtime > Run workflow). For your own use: NVIDIA's licence
# (NVIDIA-DLSS-LICENSE.txt, in the artifact) governs the DLL; do not publish it.
name: Knack DLSS runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # github.com/NVIDIA/DLSS pinned to a commit: its header defines render preset K (11) and its
      # nvngx_dlss.dll is the DLSS 4 runtime that goes with it.
      - name: NVIDIA DLSS SDK
        run: |
          git init C:/dlss-sdk
          git -C C:/dlss-sdk fetch --depth 1 https://github.com/NVIDIA/DLSS 9981c6350dc58c0ce21f024fd65e31e851c31689
          git -C C:/dlss-sdk checkout FETCH_HEAD
          foreach ($file in 'include/nvsdk_ngx_vk.h', 'lib/Windows_x86_64/x64/nvsdk_ngx_s.lib', 'lib/Windows_x86_64/rel/nvngx_dlss.dll', 'LICENSE.txt') {
              if (-not (Test-Path "C:/dlss-sdk/$file")) { throw "The DLSS SDK checkout has no $file" }
          }
      - name: Vulkan headers
        run: git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/Vulkan-Headers C:/vulkan-headers
      # The runner's Visual Studio changes with its image (2022, then 2026), so none is named: the newest
      # one with the C++ x64 tools is found, its compiler environment loaded, and NMake builds the DLL.
      - name: Build gow3_dlss.dll
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the C++ x64 tools was found on this runner' }
          Write-Host "Visual Studio: $vs"
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          # A small .bat keeps the quotes around the path out of PowerShell's argument passing.
          $bat = Join-Path $env:RUNNER_TEMP 'msvc-env.bat'
          Set-Content -Path $bat -Encoding ascii -Value "@echo off", "call `"$vcvars`" >nul", "set"
          cmd /c $bat | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process') }
          }
          Write-Host ("cl.exe: " + (Get-Command cl -ErrorAction Stop).Source)
          cmake --version | Select-Object -First 1
          # NMake first (it needs no Visual Studio generator); the Visual Studio generators are the fallback.
          $attempts = @(
              @{ Generator = 'NMake Makefiles';       Configure = @('-DCMAKE_BUILD_TYPE=Release'); Build = @() },
              @{ Generator = 'Visual Studio 18 2026'; Configure = @('-A', 'x64');                  Build = @('--config', 'Release') },
              @{ Generator = 'Visual Studio 17 2022'; Configure = @('-A', 'x64');                  Build = @('--config', 'Release') }
          )
          $built = $false
          foreach ($attempt in $attempts) {
              Write-Host "::group::cmake, generator $($attempt.Generator)"
              Remove-Item out/dlss-bridge -Recurse -Force -ErrorAction SilentlyContinue
              $configure = $attempt.Configure
              $build = $attempt.Build
              cmake -S gpu/dlss_bridge -B out/dlss-bridge -G $attempt.Generator @configure `
                  "-DDLSS_SDK_ROOT=C:/dlss-sdk" "-DVULKAN_INCLUDE=C:/vulkan-headers/include"
              $ok = ($LASTEXITCODE -eq 0)
              if ($ok) {
                  cmake --build out/dlss-bridge @build
                  $ok = ($LASTEXITCODE -eq 0)
              }
              Write-Host '::endgroup::'
              if ($ok) { $built = $true; Write-Host "Built with $($attempt.Generator)"; break }
              Write-Host "Generator $($attempt.Generator) failed; trying the next one"
          }
          if (-not $built) { throw 'The DLSS bridge could not be built with any generator' }
      - name: Gather
        run: |
          New-Item -ItemType Directory -Force dlss-runtime | Out-Null
          $bridge = Get-ChildItem out/dlss-bridge -Recurse -Filter gow3_dlss.dll | Select-Object -First 1
          if (-not $bridge) { throw 'gow3_dlss.dll was not built' }
          Copy-Item $bridge.FullName dlss-runtime/
          Copy-Item C:/dlss-sdk/lib/Windows_x86_64/rel/nvngx_dlss.dll dlss-runtime/
          Copy-Item C:/dlss-sdk/LICENSE.txt dlss-runtime/NVIDIA-DLSS-LICENSE.txt
          @"
          Copy gow3_dlss.dll and nvngx_dlss.dll into the bin folder of the game's package, next to
          gow3-probe.exe, then start the game and turn on DLSS in the menu (Insert, Image tab).
          For your own use only: NVIDIA's licence (NVIDIA-DLSS-LICENSE.txt) governs nvngx_dlss.dll.
          "@ | Set-Content dlss-runtime/README.txt
          $version = (Get-Item dlss-runtime/nvngx_dlss.dll).VersionInfo.FileVersion
          "nvngx_dlss.dll version: $version" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          Get-FileHash dlss-runtime/*.dll -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
              Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: knack-dlss-runtime
          path: dlss-runtime/
          if-no-files-found: error
